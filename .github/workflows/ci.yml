name: Windows source tests

"on":
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 10
    env:
      PYTHONUTF8: "1"
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python 3.14
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
          architecture: x64
      - name: Create virtual environment
        run: python -m venv .venv
      - name: Install locked dependencies
        run: .\.venv\Scripts\python.exe -m pip install -r requirements-lock.txt
      - name: Run complete source test suite
        run: .\.venv\Scripts\python.exe scripts/run_tests.py
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-python314-test-reports
          path: |
            tests/output.txt
            tests/results.json
            tests/results.xml
          if-no-files-found: warn
          retention-days: 14
